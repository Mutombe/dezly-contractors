<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{desc}}">
  <meta name="theme-color" content="#06050f">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{desc}}">
  <meta property="og:image" content="assets/img/hero-excavator.webp">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preload" href="assets/fonts/questrial-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    /* Hide-then-reveal only when JS is running; undo if the main script never loads. */
    document.documentElement.classList.add('js');
    setTimeout(function () { var h = document.documentElement; if (!h.classList.contains('is-loaded')) h.classList.remove('js'); }, 5000);
  </script>
</head>
<body data-page="{{page}}">
<div class="loader" aria-hidden="true">
  <div class="loader__in">
    <img class="loader__mark" src="assets/img/logo-mark-light.png" alt="" width="84" height="95">
    <div class="loader__bar"><i></i></div>
    <div class="loader__txt">We are the best</div>
  </div>
</div>
